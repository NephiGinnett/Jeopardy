<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Overlay · Dragon Heist Jeopardy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,700;1,700&family=Alegreya+Sans:wght@700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  /*
    Stream overlay. Add as an OBS Browser Source at 1920x1080.
    Optional URL settings:
      ?host=Zoe        adds a host lectern with your name on the left
      ?scale=0.85      shrinks or grows the podiums
      ?offline=hide    hides players who aren't connected
  */
  :root {
    --tile: #1f2d66; --tile-edge: #34479a; --ink: #0e1430;
    --gold: #e2b955; --gold-dim: #a8873a; --parchment: #f1e4c3; --parch-ink: #2b1f12;
    --seal: #9b2c2c; --good: #4f9a6c; --bad: #c25555;
    --s: 1;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; font-family: 'Alegreya Sans', sans-serif; }

  .stage {
    position: absolute; left: 0; right: 0; bottom: calc(2.2vh * var(--s));
    display: flex; justify-content: center; align-items: flex-end;
    gap: calc(2.2vw * var(--s)); padding: 0 3vw;
  }
  .stage.with-host { justify-content: space-between; }
  .contestants { display: flex; align-items: flex-end; gap: calc(1.6vw * var(--s)); margin: 0 auto; }

  /* ---------- podium ---------- */
  .podium {
    position: relative; flex: none;
    /* shrink to fit when there are lots of players */
    width: calc(min(14.5vw, var(--avail, 92vw) / var(--n, 5) - 1.6vw) * var(--s));
    display: flex; flex-direction: column; align-items: stretch;
    filter: drop-shadow(0 1.2vh 1.4vh rgba(0,0,0,.55));
    transition: opacity .3s, transform .3s;
  }
  .podium.offline { opacity: .45; }
  .podium.locked { opacity: .6; }

  .screen {
    background: linear-gradient(180deg, #0b1130, #121a45);
    border: calc(.25vw * var(--s)) solid var(--gold-dim); border-bottom: none;
    border-radius: calc(.5vw * var(--s)) calc(.5vw * var(--s)) 0 0;
    text-align: center; padding: calc(.7vh * var(--s)) 0;
    font-family: 'Cinzel', serif; font-weight: 700; color: var(--gold);
    font-size: calc(2.9vw * var(--s) * var(--fit, 1)); line-height: 1.15;
    text-shadow: 0 0 .9vw rgba(226,185,85,.45);
    font-variant-numeric: tabular-nums;
  }
  .screen.neg { color: #ff8a8a; text-shadow: 0 0 .9vw rgba(255,90,90,.45); }

  /* the row of buzz lights, like the show's timer lamps */
  .lamps {
    display: flex; gap: calc(.35vw * var(--s)); justify-content: center;
    background: #0a0f28; padding: calc(.55vh * var(--s)) calc(.5vw * var(--s));
    border-left: calc(.25vw * var(--s)) solid var(--gold-dim); border-right: calc(.25vw * var(--s)) solid var(--gold-dim);
  }
  .lamp { flex: 1; height: calc(.75vh * var(--s)); border-radius: 2px; background: #2a2f4c; transition: background .15s, box-shadow .15s; }
  .podium.up .lamp { background: #ffe08a; box-shadow: 0 0 .6vw #ffd36a; }
  .podium.waiting .lamp:nth-child(odd) { background: #8a7638; }

  .plate {
    background: var(--parchment); color: var(--parch-ink);
    border-left: calc(.25vw * var(--s)) solid var(--gold-dim); border-right: calc(.25vw * var(--s)) solid var(--gold-dim);
    text-align: center; padding: calc(1.2vh * var(--s)) calc(.6vw * var(--s));
    font-family: 'Alegreya', serif; font-style: italic; font-weight: 700;
    font-size: calc(2.1vw * var(--s) * var(--fit, 1)); line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: inset 0 0 1.2vw rgba(120,90,40,.35);
  }
  .front {
    height: calc(13vh * var(--s));
    background:
      linear-gradient(90deg, rgba(0,0,0,.35), transparent 18%, transparent 82%, rgba(0,0,0,.35)),
      linear-gradient(180deg, #2a3b80, var(--tile) 55%, #16204b);
    border: calc(.25vw * var(--s)) solid var(--gold-dim); border-top: calc(.4vh * var(--s)) solid var(--gold);
    clip-path: polygon(0 0, 100% 0, 94% 100%, 6% 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .crest {
    width: calc(3.4vw * var(--s)); height: calc(3.4vw * var(--s)); border-radius: 50%;
    border: calc(.2vw * var(--s)) solid var(--gold-dim); color: var(--gold-dim);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; font-size: calc(1.6vw * var(--s));
  }

  /* glow around the whole podium when someone has the floor */
  .podium.up .screen, .podium.up .lamps, .podium.up .plate, .podium.up .front { border-color: var(--gold); }
  .podium.up { transform: translateY(calc(-.6vh * var(--s))); filter: drop-shadow(0 0 1.4vw rgba(255,211,106,.55)) drop-shadow(0 1.2vh 1.4vh rgba(0,0,0,.55)); }

  /* result flashes */
  .podium.flash-good .screen { animation: flashGood 1.2s ease-out; }
  .podium.flash-bad .screen { animation: flashBad 1.2s ease-out; }
  @keyframes flashGood { 0%, 40% { background: var(--good); color: #fff; } 100% { } }
  @keyframes flashBad { 0%, 40% { background: var(--bad); color: #fff; } 100% { } }

  /* Daily Double and Final Jeopardy tags float above the podium */
  .tag {
    position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -1vh) rotate(-6deg);
    background: radial-gradient(circle at 35% 30%, #b84040, var(--seal) 60%, #6e1c1c);
    color: var(--parchment); font-family: 'Cinzel', serif; font-weight: 700; white-space: nowrap;
    font-size: calc(1vw * var(--s)); padding: calc(.6vh * var(--s)) calc(.9vw * var(--s)); border-radius: 999px;
    box-shadow: 0 .4vh .8vh rgba(0,0,0,.4); opacity: 0; transition: opacity .25s;
  }
  .tag.show { opacity: 1; }
  .tag.check { background: var(--good); }

  /* ---------- host lectern ---------- */
  .host { width: calc(13vw * var(--s)); }
  .host .screen { font-size: calc(1.5vw * var(--s)); padding: calc(1.4vh * var(--s)) 0; letter-spacing: .08em; }
  .host .plate { font-size: calc(2.3vw * var(--s)); }
  .host .front { height: calc(18vh * var(--s)); }
  .host .crest { width: calc(4.6vw * var(--s)); height: calc(4.6vw * var(--s)); font-size: calc(2.1vw * var(--s)); }

  @media (prefers-reduced-motion: reduce) { .podium, .lamp, .tag { transition: none; } .podium.flash-good .screen, .podium.flash-bad .screen { animation: none; } }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="contestants" id="contestants"></div></div>

<script>
const params = new URLSearchParams(location.search);
const hostName = params.get('host');
const hideOffline = params.get('offline') === 'hide';
if (params.get('scale')) document.documentElement.style.setProperty('--s', Number(params.get('scale')) || 1);

const stage = document.getElementById('stage');
const row = document.getElementById('contestants');
const podiums = new Map();   // player id -> elements
const shown = new Map();     // player id -> score currently displayed (for the count animation)
let lastResults = {}, lastKey = null, lastJudged = {};

const fmt = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString();

function buildPodium({ host = false } = {}) {
  const el = document.createElement('div');
  el.className = 'podium' + (host ? ' host' : '');
  el.innerHTML = `
    <div class="tag"></div>
    <div class="screen"></div>
    <div class="lamps">${'<span class="lamp"></span>'.repeat(9)}</div>
    <div class="plate"></div>
    <div class="front"><div class="crest">${host ? '🐉' : ''}</div></div>`;
  return { el, tag: el.querySelector('.tag'), screen: el.querySelector('.screen'), plate: el.querySelector('.plate'), crest: el.querySelector('.crest') };
}

if (hostName) {
  const h = buildPodium({ host: true });
  h.screen.textContent = 'Your Host';
  h.plate.textContent = hostName;
  stage.classList.add('with-host');
  row.style.setProperty('--avail', '62vw');
  stage.insertBefore(h.el, row);
  // keep contestants centered by mirroring the lectern's width on the right
  const spacer = document.createElement('div');
  spacer.style.width = getComputedStyle(h.el).width;
  stage.appendChild(spacer);
}

function animateScore(id, target, screen) {
  const from = shown.has(id) ? shown.get(id) : target;
  shown.set(id, target);
  screen.classList.toggle('neg', target < 0);
  if (from === target || matchMedia('(prefers-reduced-motion: reduce)').matches) { screen.textContent = fmt(target); return; }
  const start = performance.now(), dur = 700;
  const step = t => {
    const k = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - k, 3);
    if (shown.get(id) !== target) return; // a newer update took over
    screen.textContent = fmt(from + (target - from) * eased);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function flash(p, good) {
  p.el.classList.remove('flash-good', 'flash-bad');
  void p.el.offsetWidth; // restart the animation
  p.el.classList.add(good ? 'flash-good' : 'flash-bad');
}

function render(S) {
  const cur = S.current, f = S.final;
  const players = S.players.filter(p => !hideOffline || p.online).sort((a, b) => a.seat - b.seat);
  const ids = new Set(players.map(p => p.id));

  row.style.setProperty('--n', Math.max(players.length, 1));
  const avail = hostName ? 62 : 92;
  row.style.setProperty('--fit', Math.min(1, (avail / Math.max(players.length, 1) - 1.6) / 14.5));
  for (const [id, p] of podiums) if (!ids.has(id)) { p.el.remove(); podiums.delete(id); shown.delete(id); }

  // new clue? forget the old results so flashes only fire for fresh judgments
  const key = cur ? `${cur.c},${cur.r}` : null;
  if (key !== lastKey) { lastResults = {}; lastKey = key; }
  if (f.phase === 'off') lastJudged = {};

  players.forEach((pl, i) => {
    let p = podiums.get(pl.id);
    if (!p) { p = buildPodium(); podiums.set(pl.id, p); }
    if (row.children[i] !== p.el) row.insertBefore(p.el, row.children[i] || null);

    p.plate.textContent = pl.name;
    p.crest.textContent = (pl.name.trim()[0] || '').toUpperCase();
    animateScore(pl.id, pl.score, p.screen);

    const inClue = cur && cur.phase === 'clue' && !cur.answerShown;
    const up = (inClue && !cur.isDD && cur.queue[0] === pl.id) ||
               (cur && cur.isDD && cur.ddPlayer === pl.id && !cur.results[pl.id]);
    p.el.classList.toggle('up', !!up);
    p.el.classList.toggle('waiting', !!(inClue && !cur.isDD && cur.queue.indexOf(pl.id) > 0));
    p.el.classList.toggle('locked', !!(inClue && !cur.isDD && cur.locked.includes(pl.id)));
    p.el.classList.toggle('offline', !pl.online);

    // flashes for fresh results
    const res = cur && cur.results[pl.id];
    if (res && lastResults[pl.id] !== res) flash(p, res === 'correct');
    const fj = f.judged && f.judged[pl.id];
    if (fj && lastJudged[pl.id] !== fj) flash(p, fj === 'correct');

    // floating tags
    let tag = '', check = false;
    if (cur && cur.isDD && cur.ddPlayer === pl.id) tag = cur.ddWager != null ? `Daily Double: ${fmt(cur.ddWager)}` : 'Daily Double';
    else if (f.phase === 'wager' && f.wagered.includes(pl.id)) { tag = 'Wager locked'; check = true; }
    else if (f.phase === 'clue' && f.responded.includes(pl.id)) { tag = 'Answer locked'; check = true; }
    else if (f.phase === 'reveal' && f.wagers) tag = `Wagered ${fmt(f.wagers[pl.id] ?? 0)}`;
    p.tag.textContent = tag;
    p.tag.classList.toggle('show', !!tag);
    p.tag.classList.toggle('check', check);
  });

  lastResults = cur ? { ...cur.results } : {};
  lastJudged = f.judged ? { ...f.judged } : lastJudged;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'hello', role: 'overlay' }));
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'state') render(m); };
  ws.onclose = () => setTimeout(connect, 1500);
}
connect();
</script>
</body>
</html>
